name: AI-Repository-Scrapper

on:
    schedule:
        - cron: '0 */6 * * *'
    workflow_dispatch:

jobs:
    scrape_and_digest:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Python Setup
              uses: actions/setup-python@v5
              with:
                    python-version: "3.12"
                    cache: "pip"

            - name: Install dep
              run: |
                  pip install -r requirements.txt
            
            - name: Running The Scrapper
              env:
                    # The Actions-provisioned GITHUB_TOKEN carries a materially smaller
                    # GraphQL budget than a PAT, and the Rev.3 six-query discovery
                    # fan-out exhausts it. Requires a GH_PAT repository secret
                    # (classic PAT; public_repo scope is sufficient).
                    GITHUB_TOKEN: ${{ secrets.GH_PAT }}
                    DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
                    # Budget left untouched for customer-facing on-demand fetches.
                    GITHUB_RATELIMIT_RESERVE: "1000"
                    PYTHONPATH: .
              run: |
                  python scraper/github_velocity.py