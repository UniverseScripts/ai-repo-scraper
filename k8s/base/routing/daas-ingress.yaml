# PHASE 2 ARTIFACT — NOT THE LIVE DEPLOYMENT.
# Production currently runs on Vercel (static frontend) + Render (Docker API).
# This manifest is retained for the Phase 2 ($1,000+ MRR) K8s target described in
# the revenue-triggered scaling matrix. Keep its routes in sync with api/main.py.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: daas-ingress
  namespace: daas-production
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web, websecure
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          # Covers /api/v1/package-risk/... and /api/v1/analytics/package-risk/...
          # (Was /api/v1/ai-developer-velocity — a Rev. 1 path that no longer exists.)
          - path: /api/v1
            pathType: Prefix
            backend:
              service:
                name: fastapi-service
                port:
                  number: 80
          - path: /webhooks/lemon-squeezy
            pathType: Exact
            backend:
              service:
                name: fastapi-service
                port:
                  number: 80
